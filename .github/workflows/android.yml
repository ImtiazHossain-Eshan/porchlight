name: Android APK

# Every push and pull request builds a debug APK you can download from the run.
# Pushing a tag like v0.2.0 also publishes a GitHub Release with the APK attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create a release on tags

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-build.{0}', github.run_number) }}
      HAS_KEYSTORE: ${{ secrets.PORCHLIGHT_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Git on Windows drops the executable bit, so set it here.
      - run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename debug APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "porchlight-${VERSION_NAME}-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: porchlight-debug-apk
          path: porchlight-*-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.PORCHLIGHT_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PORCHLIGHT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        env:
          PORCHLIGHT_KEYSTORE_PASSWORD: ${{ secrets.PORCHLIGHT_KEYSTORE_PASSWORD }}
          PORCHLIGHT_KEY_ALIAS: ${{ secrets.PORCHLIGHT_KEY_ALIAS }}
          PORCHLIGHT_KEY_PASSWORD: ${{ secrets.PORCHLIGHT_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk "porchlight-${VERSION_NAME}.apk"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Signed APK when the keystore secrets exist; otherwise the debug APK.
          files: |
            porchlight-*.apk
