name: Web

# Builds the web version (Kotlin/Wasm) and publishes it to GitHub Pages on every push to
# multiplatform. Open it on an iPhone (iOS 18.2+) in Safari; Share > Add to Home Screen makes it
# open full screen and play offline. One-time setup: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [multiplatform]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x gradlew

      - name: Shared tests in headless Chrome
        run: ./gradlew :shared:wasmJsBrowserTest --stacktrace

      - name: Build the site
        run: ./gradlew :webApp:wasmJsBrowserDistribution --stacktrace

      # Source maps stay out of the published site.
      - run: rm -f webApp/build/dist/wasmJs/productionExecutable/*.map

      - uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
