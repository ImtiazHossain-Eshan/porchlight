name: iOS

# The shared game rules, tested on the iOS simulator. Needs a Mac, so it runs on GitHub's macOS runners.
on:
  push:
    branches: [main, multiplatform]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x gradlew

      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-report
          path: shared/build/reports/tests/iosSimulatorArm64Test/
