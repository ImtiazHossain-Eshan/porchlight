<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- No zoom; the page runs under the notch and the home bar, and #porchlight keeps clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Porchlight</title>
    <meta name="description" content="A memory game on a porch at night: light the bulb, remember the moths, find the pairs before it burns out.">
    <meta name="theme-color" content="#0E1A24">
    <meta name="color-scheme" content="dark">
    <!-- Added to the Home Screen it opens full screen, like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Porchlight">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            position: fixed;
            inset: 0;
            background: #0E1A24;
            color: #F6E8CC;
            font-family: -apple-system, system-ui, sans-serif;
            /* No text selection, long-press callouts, tap flashes, rubber-banding or double-tap zoom. */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
            touch-action: none;
        }
        /* The game, inside the safe area. The wall colour fills the notch and home-bar strips. */
        #porchlight {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left: env(safe-area-inset-left, 0px);
            touch-action: none;
        }
        #porchlight canvas { outline: none; }
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: max(24px, env(safe-area-inset-top)) 28px max(24px, env(safe-area-inset-bottom));
            box-sizing: border-box;
            text-align: center;
            background: radial-gradient(circle at 50% 38%, #3a2c16 0%, #0E1A24 55%);
        }
        .screen img { width: 112px; height: 112px; border-radius: 26px; }
        .screen h1 { margin: 6px 0 0; font-size: 26px; letter-spacing: 0.06em; color: #FFC24A; }
        .screen p { margin: 0; max-width: 22em; font-size: 16px; line-height: 1.45; color: #C4AC88; }
        #loading { transition: opacity 0.35s ease; }
        #loading.gone { opacity: 0; pointer-events: none; }
        #loading .glow { width: 10px; height: 10px; border-radius: 50%; background: #FFD27A; box-shadow: 0 0 22px 8px rgba(255, 159, 67, 0.55); animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: 0.35; } }
        @media (prefers-reduced-motion: reduce) { #loading .glow { animation: none; } }
        #update, #turn { display: none; }
        /* A phone on its side gets asked to turn back: the porch is built for portrait. */
        @media (orientation: landscape) and (max-height: 500px) {
            #turn { display: flex; z-index: 10; }
        }
    </style>
</head>
<body>
<div id="porchlight"></div>

<div id="loading" class="screen" aria-live="polite">
    <img src="icons/icon-192.png" alt="">
    <div class="glow" aria-hidden="true"></div>
    <p>Lighting the porch…</p>
</div>

<div id="update" class="screen" role="alert">
    <img src="icons/icon-192.png" alt="">
    <h1>PORCHLIGHT</h1>
    <p>This porch needs a newer browser. On iPhone, update to iOS 18.2 or later in Settings › General › Software Update, then come back.</p>
    <p>On a computer, any current Chrome, Edge, Firefox or Safari works.</p>
</div>

<div id="turn" class="screen" role="alert">
    <img src="icons/icon-192.png" alt="">
    <p>Turn your phone upright to play.</p>
</div>

<script>
    (function () {
        // Kotlin/Wasm needs WebAssembly garbage collection: Safari 18.2+, Chrome 119+, Firefox 120+.
        // This tiny module (one empty struct type) only validates where GC is supported.
        function hasWasmGc() {
            try {
                return typeof WebAssembly === 'object' &&
                    WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 3, 1, 95, 0]));
            } catch (e) {
                return false;
            }
        }
        // Every iPhone browser is Safari underneath, so the iOS version is what counts there.
        function oldIos() {
            var m = navigator.userAgent.match(/(?:iPhone|iPad|iPod).* OS (\d+)_(\d+)/);
            return !!m && (+m[1] < 18 || (+m[1] === 18 && +m[2] < 2));
        }
        var loading = document.getElementById('loading');
        if (!hasWasmGc() || oldIos()) {
            loading.style.display = 'none';
            document.getElementById('update').style.display = 'flex';
            return;
        }
        window.porchlightReady = function () {
            loading.classList.add('gone');
            setTimeout(function () { loading.style.display = 'none'; }, 400);
        };
        // iOS ignores user-scalable=no; these stop pinch zoom outright.
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
            document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
        });
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        var script = document.createElement('script');
        script.src = 'porchlight.js';
        script.type = 'application/javascript';
        document.body.appendChild(script);
        // Offline play: the service worker keeps a copy of everything the game has loaded.
        if ('serviceWorker' in navigator && location.protocol === 'https:') {
            navigator.serviceWorker.register('sw.js').catch(function () {});
        }
    })();
</script>
</body>
</html>
